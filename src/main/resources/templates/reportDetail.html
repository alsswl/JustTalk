<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>리포트</title>
  <style>
    @font-face {
      font-family: 'GmarketSansMedium';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    /* 전체 레이아웃 스타일 */
    body {
      font-family: 'GmarketSansMedium';
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* 제목 스타일 */
    h1 {
      font-family: 'GmarketSansMedium';
      color: #333;
      text-align: center;
    }

    /* 카드 스타일 */
    #report-details {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 80%;
      max-width: 600px;
      margin: 20px;
    }

    /* 각 항목 스타일 */
    p {
      font-family: 'GmarketSansMedium';
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin: 10px 0;
      white-space: pre-line;
    }

    /* 항목 제목 스타일 */
    p strong {
      font-family: 'GmarketSansMedium';
      color: #4169e1;
      font-weight: 600;
    }

  </style>
</head>
<body>
<div id="report-details">
  <h1>리포트</h1>
</div>

<script>
  // 로컬 스토리지에서 reportDetails 데이터를 가져오기
  const reportDetails = JSON.parse(localStorage.getItem('reportDetails'));

  if (reportDetails) {
    // 데이터를 HTML에 렌더링
    document.getElementById('report-details').innerHTML += `
        <p><strong>동물친구:</strong> ${reportDetails.animal}</p>
        <p><strong>리포트 내용:</strong> ${reportDetails.report}</p>
        <p><strong>날짜:</strong> ${new Date(reportDetails.date).toLocaleDateString()}</p>
        <p><strong>대화내용:</strong> ${reportDetails.chatContent}</p>
      `;
  } else {
    document.getElementById('report-details').innerText = "리포트 데이터를 로드할 수 없습니다.";
  }
</script>
</body>
</html>
